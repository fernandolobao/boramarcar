name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valores fictícios: build e testes não acessam serviços reais.
  SKIP_ENV_VALIDATION: '1'
  DATABASE_URL: postgres://boramarcar:boramarcar@localhost:5432/boramarcar
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci
  GOOGLE_CLIENT_SECRET: ci
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, formatação e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck

  test:
    name: Testes unitários e de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (com cobertura)
        run: pnpm test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
              console.log(["### Cobertura", "", "| Métrica | % | Cobertos |", "|---|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  migrations:
    name: Migrations (Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boramarcar
          POSTGRES_PASSWORD: boramarcar
          POSTGRES_DB: boramarcar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boramarcar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations estão em dia com o schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::O schema mudou mas a migration não foi gerada. Rode 'pnpm db:generate' e faça commit."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - name: Consistência das migrations
        run: pnpm db:check
      - name: Aplicar migrations
        run: pnpm db:migrate

  build-e2e:
    name: Build e testes E2E (inclui acessibilidade)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boramarcar
          POSTGRES_PASSWORD: boramarcar
          POSTGRES_DB: boramarcar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boramarcar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco real: os testes E2E populam dados e auditam todas as telas logadas com axe.
      SKIP_ENV_VALIDATION: ''
      E2E_DATABASE_URL: postgres://boramarcar:boramarcar@localhost:5432/boramarcar
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations
        run: pnpm db:migrate
      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Instalar navegadores do Playwright
        run: pnpm --filter @boramarcar/web exec playwright install --with-deps chromium
      - name: Playwright (smoke + acessibilidade WCAG 2.2 AA, claro/escuro, desktop/mobile)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
