name: CI

# Economia de minutos do Actions (o repositório é privado: 2.000 min/mês no plano grátis, e cada
# job é cobrado arredondado para cima ao minuto):
# - um job só para lint, formatação, tipos e testes (uma instalação em vez de duas);
# - o app mobile só quando ele (ou um pacote que ele usa) muda;
# - build + E2E só quando o site, os pacotes ou o banco mudam (as migrations são checadas ali);
# - nos PRs, o E2E roda só no Chrome de computador; o perfil de celular roda na `main` ou com o
#   rótulo `e2e-completo` no PR;
# - um commit novo cancela a execução anterior do mesmo PR (concurrency).

on:
  pull_request:
    # `labeled`: pôr o rótulo `e2e-completo` roda o CI de novo com o perfil de celular.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valores fictícios: build e testes não acessam serviços reais.
  SKIP_ENV_VALIDATION: '1'
  DATABASE_URL: postgres://boramarcar:boramarcar@localhost:5432/boramarcar
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci
  GOOGLE_CLIENT_SECRET: ci
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: O que mudou
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            mobile:
              - *shared
              - 'apps/mobile/**'
            web:
              - *shared
              - 'apps/web/**'

  quality:
    name: Lint, formatação, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest (com cobertura)
        run: pnpm test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
              console.log(["### Cobertura", "", "| Métrica | % | Cobertos |", "|---|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  mobile:
    name: App mobile (bundle Android e iOS)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Expo export (Metro empacota o app sem erros)
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
        run: npx expo export --platform android --platform ios --output-dir dist

  build-e2e:
    name: Migrations, build e testes E2E (inclui acessibilidade)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boramarcar
          POSTGRES_PASSWORD: boramarcar
          POSTGRES_DB: boramarcar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boramarcar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco real: os testes E2E populam dados e auditam todas as telas logadas com axe.
      SKIP_ENV_VALIDATION: ''
      E2E_DATABASE_URL: postgres://boramarcar:boramarcar@localhost:5432/boramarcar
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations estão em dia com o schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::O schema mudou mas a migration não foi gerada. Rode 'pnpm db:generate' e faça commit."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - name: Consistência das migrations
        run: pnpm db:check
      - name: Aplicar migrations (Postgres real)
        run: pnpm db:migrate
      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      # O download do Chromium às vezes trava (CDN do Playwright ou espelhos do apt fora do ar):
      # cache por versão, tentativas com tempo limite e as dependências do sistema à parte.
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Instalar navegadores do Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 pnpm --filter @boramarcar/web exec playwright install chromium && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::Download do Chromium falhou (tentativa $i); tentando de novo"
            sleep 15
          done
      # As bibliotecas do Chromium já vêm na imagem do runner (que tem o Google Chrome). O apt
      # é só garantia: se os espelhos estiverem fora do ar, segue com aviso em vez de falhar;
      # se faltar mesmo alguma biblioteca, o passo seguinte falha com a mensagem do Playwright.
      - name: Dependências do sistema para o Chromium
        timeout-minutes: 6
        run: |
          for i in 1 2; do
            timeout 120 pnpm --filter @boramarcar/web exec playwright install-deps chromium && exit 0
            echo "::warning::apt falhou (tentativa $i)"
            sleep 10
          done
          echo "::warning::Seguindo sem atualizar as dependências do sistema (apt indisponível)"
      - name: Playwright (smoke + acessibilidade WCAG 2.2 AA, claro/escuro, desktop/mobile)
        env:
          # PR: só computador (o celular roda na main ou com o rótulo `e2e-completo`).
          E2E_PROJECTS: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'e2e-completo') && '--project=chromium' || '' }}
        run: pnpm test:e2e $E2E_PROJECTS
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
