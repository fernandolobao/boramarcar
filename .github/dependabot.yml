version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@testing-library/*', 'jsdom']
      drizzle:
        patterns: ['drizzle-*', '@electric-sql/pglite', 'pg', '@types/pg']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
