# Postgres local para desenvolvimento: `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: boramarcar
      POSTGRES_PASSWORD: boramarcar
      POSTGRES_DB: boramarcar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boramarcar']
      interval: 5s
      retries: 10

volumes:
  pgdata:
